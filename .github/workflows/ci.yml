name: Pharos CI

on:
  push:
    branches:
      - main
      - feature/backend
      - feature/phase-3-auth
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: pharos
          POSTGRES_USER: pharos_user
          POSTGRES_PASSWORD: pharos_password
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U pharos_user -d pharos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://pharos_user:pharos_password@localhost:5432/pharos
      JWT_SECRET: ci-test-secret

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create test database
        run: |
          PGPASSWORD=pharos_password psql \
            -h localhost \
            -p 5432 \
            -U pharos_user \
            -d pharos \
            -c "CREATE DATABASE pharos_test;"

      - name: Apply database migrations
        run: alembic -c backend/alembic.ini upgrade head

      - name: Apply test database migrations
        env:
          DATABASE_URL: postgresql+psycopg://pharos_user:pharos_password@localhost:5432/pharos_test
        run: alembic -c backend/alembic.ini upgrade head

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg://pharos_user:pharos_password@localhost:5432/pharos_test
        run: pytest